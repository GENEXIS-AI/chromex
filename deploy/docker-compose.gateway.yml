services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /data/chromex-gateway/secrets/gateway.env
    environment:
      HOST: 0.0.0.0
      PORT: 18787
      CODEX_HOME: /data/codex-home
      CODEX_SIDEPANEL_HOME: /data/codex-sidepanel
      CHROMEX_WORKSPACE_ROOT: /data/workspace
      CHROMEX_ASSET_DIR: /data/assets
      CHROMEX_LOG_DIR: /data/logs
      CHROMEX_VISION_TEMP_DIR: /data/vision-tmp
      CHROMEX_COACH_TEMP_DIR: /data/coach-tmp
    user: "${CHROMEX_RUN_USER:-995:985}"
    ports:
      - "127.0.0.1:18787:18787"
    volumes:
      - /data/chromex-gateway/codex-home:/data/codex-home
      - /data/chromex-gateway/codex-sidepanel:/data/codex-sidepanel
      - /data/chromex-gateway/workspace:/data/workspace
      - /data/chromex-gateway/assets:/data/assets
      - /data/chromex-gateway/logs:/data/logs
      - /data/chromex-gateway/vision-tmp:/data/vision-tmp
      - /data/chromex-gateway/coach-tmp:/data/coach-tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18787/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
